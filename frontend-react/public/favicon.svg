<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 亮色渐变背景 -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- 顶部光泽 -->
  <rect width="32" height="16" rx="8" fill="url(#shine)"/>

  <!-- "AI" 大字，清晰醒目 -->
  <text
    x="16" y="21"
    text-anchor="middle"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="15"
    font-weight="800"
    fill="white"
    letter-spacing="-0.5"
  >AI</text>

  <!-- 底部装饰：两个小圆点代表思考与情绪 -->
  <circle cx="12" cy="26" r="1.2" fill="white" fill-opacity="0.5"/>
  <circle cx="16" cy="27" r="1.2" fill="white" fill-opacity="0.75"/>
  <circle cx="20" cy="26" r="1.2" fill="white" fill-opacity="0.5"/>

  <!-- 顶部星光点缀 -->
  <circle cx="24" cy="6" r="1" fill="white" fill-opacity="0.6"/>
  <circle cx="27" cy="10" r="0.6" fill="white" fill-opacity="0.4"/>
</svg>
